server {
    listen 127.0.0.1:9000;
    root /var/www/shared_root;
    client_max_body_size 50000;
    autoindex on;

    location / {
        allow_methods GET;
        # Doit hériter de /var/www/shared_root et 50000
    }

    location /redirect-me {
        allow_methods GET;
        return 301 http://127.0.0.1:9000/destination;
    }

    location /destination {
        allow_methods GET;
        root /var/www/dest_folder; # Override du root
    }
}